<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TV - Baymax</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {

            background-color: #5c4033;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            overflow: hidden;
        }


        .tv-container {

            display: flex;

            width: 95vw;

            height: 90vh;

            gap: 18px;
        }


        .left-panel {

            display: flex;

            flex-direction: column;

            width: 35%;

            gap: 18px;
        }


        .right-panel {

            display: flex;

            flex-direction: column;

            width: 65%;

            gap: 18px;
        }


        .box {

            background-color: #63d4f4;

            border:
                6px solid
                #b39b82;

            border-radius: 15px;

            padding: 20px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.3);
        }


        .box-title {

            color: #ffffff;

            font-size: 2.2vw;

            font-weight: bold;

            text-transform: uppercase;

            text-shadow:
                1px 1px 2px
                rgba(0, 0, 0, 0.5);

            margin-bottom: 12px;
        }


        /* =========================
           GUICHÊ
        ========================= */

        .local-box {

            flex: 1;
        }


        .local-number {

            color: #d12f2f;

            font-size: 9vw;

            font-weight: bold;

            line-height: 1;
        }


        .local-type {

            color: #555;

            font-size: 1.8vw;

            font-weight: bold;

            margin-top: 6px;
        }


        /* =========================
           HISTÓRICO
        ========================= */

        .history-box {

            flex: 1;

            justify-content:
                flex-start;

            align-items:
                flex-start;
        }


        .history-box .box-title {

            font-size: 1.8vw;

            align-self: center;
        }


        #history-list {

            list-style: none;

            width: 100%;

            color: #d12c2c;

            font-size: 1.5vw;

            font-weight: bold;

            text-align: left;

            margin-top: 5px;
        }


        #history-list li {

            margin-bottom: 8px;

            border-bottom:
                1px solid
                rgba(0, 0, 0, 0.1);

            padding-bottom: 5px;
        }


        /* =========================
           PACIENTE
        ========================= */

        .patient-box {

            flex: 3;
        }


        .patient-name {

            color: #d12c2c;

            font-size: 6.5vw;

            font-weight: bold;

            line-height: 1.2;

            word-break: break-word;
        }


        /* =========================
           LOGO
        ========================= */

        .logo-box {

            flex: 1;
        }


        .logo-text {

            color: #d12c2c;

            font-size: 3.5vw;

            font-weight: bold;

            text-transform: uppercase;
        }


        /* =========================
           ANIMAÇÃO DA CHAMADA
        ========================= */

        @keyframes flash {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }


        .flash {

            animation:
                flash
                0.5s
                ease
                3;
        }


        /* =========================
           RESPONSIVIDADE
        ========================= */

        @media (max-width: 800px) {

            .tv-container {

                width: 95vw;

                height: 90vh;

                flex-direction: column;
            }


            .left-panel,
            .right-panel {

                width: 100%;
            }


            .left-panel {

                height: 40%;
            }


            .right-panel {

                height: 60%;
            }


            .box-title {

                font-size: 4vw;
            }


            .local-number {

                font-size: 12vw;
            }


            .patient-name {

                font-size: 10vw;
            }


            .logo-text {

                font-size: 6vw;
            }


            #history-list {

                font-size: 3vw;
            }
        }

    </style>

</head>


<body>

    <div class="tv-container">


        <!-- =========================
             PAINEL ESQUERDO
        ========================== -->

        <div class="left-panel">


            <!-- GUICHÊ -->

            <div class="box local-box">

                <div
                    class="box-title"
                    id="local-tipo">

                    GUICHÊ

                </div>


                <div
                    class="local-number"
                    id="local-numero">

                    ---

                </div>

            </div>


            <!-- HISTÓRICO -->

            <div class="box history-box">

                <div class="box-title">

                    ÚLTIMAS CHAMADAS

                </div>


                <ul id="history-list"></ul>

            </div>


        </div>


        <!-- =========================
             PAINEL DIREITO
        ========================== -->

        <div class="right-panel">


            <!-- PACIENTE -->

            <div class="box patient-box">

                <div class="box-title">

                    PACIENTE

                </div>


                <div
                    class="patient-name"
                    id="patient-name">

                    AGUARDANDO...

                </div>

            </div>


            <!-- LOGO -->

            <div class="box logo-box">

                <div class="logo-text">

                    BAYMAX

                </div>

            </div>


        </div>


    </div>


    <script>

        // Guarda o ID da última chamada
        // para detectar quando chegar uma nova

        let ultimaId = null;


        // =====================================================
        // ATUALIZAR TV
        // =====================================================

        function atualizar() {

            fetch("/tv/chamada")

                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Erro HTTP: " +
                            response.status
                        );

                    }

                    return response.json();

                })


                .then(data => {

                    const chamada =
                        data.chamada;

                    const historico =
                        data.historico || [];


                    // =================================================
                    // CHAMADA ATUAL
                    // =================================================

                    if (chamada) {

                        document
                            .getElementById(
                                "local-tipo"
                            )
                            .innerText =
                                chamada.localTipo ||
                                "GUICHÊ";


                        document
                            .getElementById(
                                "local-numero"
                            )
                            .innerText =
                                chamada.localNumero ||
                                "---";


                        document
                            .getElementById(
                                "patient-name"
                            )
                            .innerText =
                                chamada.paciente ||
                                "AGUARDANDO...";


                        // =================================================
                        // NOVA CHAMADA
                        // =================================================

                        if (
                            chamada.id !==
                            ultimaId
                        ) {

                            ultimaId =
                                chamada.id;


                            const patientBox =
                                document.querySelector(
                                    ".patient-box"
                                );


                            patientBox.classList
                                .remove(
                                    "flash"
                                );


                            // Força o navegador
                            // a reiniciar a animação

                            void patientBox.offsetWidth;


                            patientBox.classList
                                .add(
                                    "flash"
                                );
                        }

                    }


                    // =================================================
                    // HISTÓRICO
                    // =================================================

                    const list =
                        document.getElementById(
                            "history-list"
                        );


                    list.innerHTML = "";


                    historico
                        .slice(0, 4)
                        .forEach(h => {

                            const li =
                                document.createElement(
                                    "li"
                                );


                            const tipo =
                                h.localTipo
                                    ? h.localTipo
                                        .substring(0, 4)
                                        .toUpperCase()
                                    : "GUIC";


                            const numero =
                                h.localNumero ||
                                "---";


                            const paciente =
                                h.paciente ||
                                "PACIENTE";


                            li.innerText =
                                `${tipo}. ${numero} - ${paciente}`;


                            list.appendChild(li);

                        });

                })


                .catch(error => {

                    console.log(
                        "Erro ao buscar chamada:",
                        error
                    );

                });

        }


        // =====================================================
        // PRIMEIRA ATUALIZAÇÃO
        // =====================================================

        atualizar();


        // =====================================================
        // ATUALIZA A CADA 2 SEGUNDOS
        // =====================================================

        setInterval(
            atualizar,
            2000
        );

    </script>

</body>

</html>
