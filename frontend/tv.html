<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #5c4033;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .tv-container {
            display: flex;
            width: 95vw;
            height: 90vh;
            gap: 18px;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            width: 35%;
            gap: 18px;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            width: 65%;
            gap: 18px;

        }

        .box {
            background-color: #63d4f4;
            border: 6px solid #b39b82;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);

        }

        .box-title {
            color: #ffffff;
            font-size: 2.2vw;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            margin-bottom: 12px;
        }

        .local-box {
            flex: 1;
        }

        .local-number {
            color: #d12f2f;
            font-size: 9vw;
            font-weight: bold;
            line-height: 1;
        }

        .local-type {
            color: #555;
            font-size: 1.8vw;
            font-weight: bold;
            margin-top: 6px;
        }

        .history-box {
            flex: 1;
            justify-content: flex-start;
            align-items: flex-start;
        }

        .history-box .box-title {
            font-size: 1.8vw;
            align-self: center;
        }

        #history-list {
            list-style: none;
            width: 100%;
            color: #d12c2c;
            font-size: 1.5vw;
            font-weight: bold;
            text-align: left;
        }

        #history-list li {
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 5px;
        }

        .patient-box {
            flex: 3;
        }

        .patient-name {
            color: #d12c2c;
            font-size: 6.5vw;
            font-weight: bold;
            line-height: 1.2;
            word-break: break-word;
        }

        .logo-box {
            flex: 1;
        }

        .logo-text {
            color: #d12c2c;
            font-size: 3.5vw;
            font-weight: bold;
            text-transform: uppercase;
        }

        @keyframes flash {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .flash {
            animation: flash 0.5s ease 3;
        }
    </style>
    <title>TV</title>
</head>
<div classe="tv-container">
    <div class="left-panel">
        <div class="box local-box">
            <div class="box-title" id="local-tipo">GUICHÊ</div>
            <div class="local-number" id="local-numero">---</div>
        </div>

        <div class="box history-box">
            <div class="box-title">ÚLTIMAS CHAMADAS</div>
            <ul id="history-list"></ul>
        </div>
          </div>
          <div class="right-panel">
            <div class="box patient-box">
                 <div class="box-title"> PACIENTE</div>
                  <div class="patient-name" id="patient-name">AGUARDANDO...</div>
            </div>
             <div class="box logo-box">
                <div class="logo-text">baymax</div>
             </div>
          </div>
         </div>
         <script>
            let ultimold = null;
               // Função criada para buscar a chamada atual e o 
               // historico da TVem tempo real
               function atualizar() {
                fetch("/tv/chamada")
                .then(r => json()) 
                .then(data => {
                const chamada = data.chamada;
                const historico = data.historico || [];
                if (chamada) {
                    document.getElementById("local-tipo").innerText = chamada.localTipo || "GUICHÊ";
                    document.getElementById("local-numero").innerText = chamada.localNumero || "--"
                    document.getElementById("patient-name").innerText = chamada.paciente || "AGUARDANDO...";


                // Flash visual quando há chamada nova
                if (chamada.id !== ultmold) {
                    ultimold = chamada.id;
                    const patientBox = document.querySelector(".patient-box");
                    patientBox.classList.remove("flash");
                    void patientBox.offsetWidth //neflow
                    patientBox.classList.add("flash");
                }
            }
                //historico
                const list = document.getElementById("history-list");
                list.innerText = "";
                historico.slice(0, 4).forEach(h => {
                    const li = document.createElement("li");
                    const tipo = h.localTipo ? h.localTipo.substring(0,4) : "QUIC";
                    li.innerText = `${tipo}. ${h.localnumero} - ${h.paciente}`
                    list.appendChild(li);
                    });
               })
               .catch(err => console.log("Erro ao buscar chamada:", err));
               }
               // poling = cada 2 segundo
               atualizar();
               setInterval(atualizar, 2000);
         </script>

</body>
</html>
