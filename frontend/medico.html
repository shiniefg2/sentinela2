<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atendimento Médico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>Atendimento Médico</h1>
    <button onclick="logout()">Sair</button>
  </header>

  <main class="container">
    <div class="card">
      <h2>Aguardando Atendimento Médico</h2>
      <ul id="listaFila" class="pacientes-list">
        <li>Carregando fila...</li>
      </ul>
    </div>

    <div class="card">
      <h2>Consulta Médica</h2>
      <form id="form-consulta">
        <input type="hidden" id="pacienteId">

        <label for="paciente">Nome do Paciente:</label>
        <input type="text" id="paciente" placeholder="Selecione na lista ao lado" readonly required>

        <label for="diagnostico">Diagnóstico / Anamnese:</label>
        <textarea id="diagnostico" placeholder="Descreva os sintomas e o diagnóstico..." rows="3" required></textarea>

        <label for="medicacao">Prescrição de Medicamentos (Enfermagem):</label>
        <textarea id="medicacao" placeholder="Caso precise de medicação na unidade, descreva aqui. Se não precisar, deixe em branco." rows="3"></textarea>

        <label for="obs">Observações / Orientações:</label>
        <input type="text" id="obs" placeholder="Ex: Repouso, beber bastante água...">

        <button type="submit">Finalizar Consulta</button>
      </form>
    </div>
  </main>

  <script>
    const API_URL = "http://localhost:3000";

    // 1. Verificar Autenticação
    const usuarioLogado = JSON.parse(sessionStorage.getItem("usuario"));
    if (!usuarioLogado || usuarioLogado.tipo !== "medico") {
      window.location.href = "login.html";
    }

    function logout() {
      sessionStorage.removeItem("usuario");
      window.location.href = "login.html";
    }

    // 2. Carregar Fila de Espera (Apenas status 'aguardando_medico')
    async function carregarFila() {
      const listaFila = document.getElementById("listaFila");
      listaFila.innerHTML = "<li>Carregando fila...</li>";

      try {
        const res = await fetch(`${API_URL}/pacientes?status=aguardando_medico`);
        const pacientes = await res.json();

        listaFila.innerHTML = "";

        if (pacientes.length === 0) {
          listaFila.innerHTML = "<li>Nenhum paciente aguardando no momento.</li>";
          return;
        }

        pacientes.forEach(p => {
          const li = document.createElement("li");
          li.classList.add("paciente-item");
          li.innerHTML = `
            <strong>${p.nome}</strong> - Idade: ${p.idade || 'N/I'} <br>
            <small>Prioridade: ${p.prioridade || 'Normal'}</small>
          `;
          li.onclick = () => selecionarPaciente(p);
          listaFila.appendChild(li);
        });
      } catch (error) {
        console.error("Erro ao buscar fila do médico:", error);
        listaFila.innerHTML = "<li>Erro ao carregar pacientes.</li>";
      }
    }

    // 3. Preencher Formulário com o Paciente Selecionado
    function selecionarPaciente(paciente) {
      document.getElementById("pacienteId").value = paciente.id;
      document.getElementById("paciente").value = paciente.nome;
      document.getElementById("diagnostico").focus();
    }

    // 4. Salvar Consulta Médica e Encaminhar
    document.getElementById("form-consulta").addEventListener("submit", async (e) => {
      e.preventDefault();

      const pacienteId = document.getElementById("pacienteId").value;
      if (!pacienteId) {
        alert("Selecione um paciente na lista primeiro!");
        return;
      }

      const medicacaoTexto = document.getElementById("medicacao").value.trim();
      
      // Define o próximo status: se houver medicação vai pra enfermagem, senão vai direto pra alta
      const proximoStatus = medicacaoTexto ? "aguardando_medicacao" : "aguardando_alta";

      const dadosConsulta = {
        pacienteId: Number(pacienteId),
        paciente: document.getElementById("paciente").value,
        diagnostico: document.getElementById("diagnostico").value,
        medicacao: medicacaoTexto,
        obs: document.getElementById("obs").value,
        dataHora: new Date().toISOString()
      };

      try {
        // Salva o registro da consulta
        const resConsulta = await fetch(`${API_URL}/consultas`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dadosConsulta)
        });

        // Atualiza o status do paciente
        const resStatus = await fetch(`${API_URL}/pacientes/${pacienteId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: proximoStatus })
        });

        if (resConsulta.ok && resStatus.ok) {
          if (medicacaoTexto) {
            alert("Consulta finalizada! Paciente encaminhado para a ENFERMAGEM/MEDICAÇÃO.");
          } else {
            alert("Consulta finalizada! Paciente encaminhado direto para a ALTA.");
          }
          
          document.getElementById("form-consulta").reset();
          document.getElementById("pacienteId").value = "";
          carregarFila();
        } else {
          alert("Erro ao salvar consulta. Tente novamente.");
        }
      } catch (error) {
        console.error("Erro ao salvar consulta:", error);
        alert("Erro de conexão com o servidor.");
      }
    });

    // Inicia a fila ao carregar a página
    carregarFila();
  </script>
</body>
</html>
