<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem - Baymax</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; }
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .panel { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .list-panel { flex: 1; }
        .form-panel { flex: 1.5; }
        h2 { margin-bottom: 15px; color: #333; }
        ul { list-style: none; }
        li { padding: 12px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        button { cursor: pointer; padding: 8px 12px; border: none; border-radius: 4px; font-weight: bold; }
        .btn-call { background-color: #f39c12; color: #fff; margin-right: 5px; }
        .btn-select { background-color: #3498db; color: #fff; }
        .btn-submit { background-color: #2ecc71; color: #fff; width: 100%; padding: 12px; font-size: 16px; margin-top: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <!-- FILA DE ESPERA -->
    <div class="panel list-panel">
        <h2>Fila de Espera</h2>
        <ul id="lista-pacientes">
            <li>Carregando...</li>
        </ul>
    </div>

    <!-- FORMULÁRIO DE TRIAGEM -->
    <div class="panel form-panel">
        <h2>Realizar Triagem</h2>
        <form id="form-triagem">
            <input type="hidden" id="pacienteId">
            
            <div class="form-group">
                <label>Nome do Paciente:</label>
                <input type="text" id="nome" readonly placeholder="Selecione um paciente na fila">
            </div>

            <div class="form-group">
                <label>Sintomas:</label>
                <textarea id="sintoma" rows="2" required></textarea>
            </div>

            <div class="form-group">
                <label>Temperatura (°C):</label>
                <input type="number" step="0.1" id="temperatura" required>
            </div>

            <div class="form-group">
                <label>Alergias:</label>
                <input type="text" id="alergia" placeholder="Caso houver">
            </div>

            <div class="form-group">
                <label>Classificação de Risco Manual (Opcional):</label>
                <select id="risco">
                    <label>Selecione se necessário</label>
                    <option value="">Automático (com base na temperatura)</option>
                    <option value="verde">Verde (Pouco Urgente)</option>
                    <option value="amarelo">Amarelo (Urgente)</option>
                    <option value="vermelho">Vermelho (Emergência)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Observações:</label>
                <textarea id="observacao" rows="2"></textarea>
            </div>

            <button type="submit" class="btn-submit">Finalizar Triagem e Enviar ao Médico</button>
        </form>
    </div>
</div>

<script>
    const API_URL = "http://localhost:3000";

    // CARREGAR PACIENTES DA FILA
    async function carregarFila() {
        try {
            const res = await fetch(`${API_URL}/pacientes/triagem`);
            const pacientes = await res.json();

            const lista = document.getElementById("lista-pacientes");
            lista.innerHTML = "";

            if (pacientes.length === 0) {
                lista.innerHTML = "<li>Nenhum paciente aguardando.</li>";
                return;
            }

            pacientes.forEach(p => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <span><strong>${p.nome}</strong> (${p.tipo})</span>
                    <div>
                        <button class="btn-call" onclick="chamarTV('${p.nome}')">Chamar TV</button>
                        <button class="btn-select" onclick="selecionarPaciente(${p.id}, '${p.nome}')">Atender</button>
                    </div>
                `;
                lista.appendChild(li);
            });
        } catch (error) {
            console.error("Erro ao carregar fila:", error);
        }
    }

    // CHAMAR PACIENTE NA TV
    async function chamarTV(nome) {
        await fetch(`${API_URL}/tv/chamar`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                paciente: nome,
                localTipo: "TRIAGEM",
                localNumero: "01"
            })
        });
        alert(`Paciente ${nome} chamado na TV!`);
    }

    // SELECIONAR PACIENTE PARA O FORMULÁRIO
    function selecionarPaciente(id, nome) {
        document.getElementById("pacienteId").value = id;
        document.getElementById("nome").value = nome;
    }

    // SALVAR TRIAGEM
    document.getElementById("form-triagem").addEventListener("submit", async (e) => {
        e.preventDefault();

        const pacienteId = document.getElementById("pacienteId").value;
        if (!pacienteId) {
            alert("Selecione um paciente na lista primeiro!");
            return;
        }

        const dados = {
            pacienteId: Number(pacienteId),
            nome: document.getElementById("nome").value,
            sintoma: document.getElementById("sintoma").value,
            temperatura: parseFloat(document.getElementById("temperatura").value),
            alergia: document.getElementById("alergia").value,
            risco: document.getElementById("risco").value || undefined,
            observacao: document.getElementById("observacao").value
        };

        try {
            const res = await fetch(`${API_URL}/triagem`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dados)
            });

            if (res.ok) {
                alert("Triagem concluída com sucesso!");
                document.getElementById("form-triagem").reset();
                carregarFila();
            }
        } catch (error) {
            console.error("Erro ao salvar triagem:", error);
        }
    });

    // Atualiza a fila ao carregar a página e a cada 5 segundos
    carregarFila();
    setInterval(carregarFila, 5000);
</script>

</body>
</html>
