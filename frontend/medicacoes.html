<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setor de Medicação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h1>Setor de Medicação</h1>
    <button onclick="logout()">Sair</button>
  </header>

  <main class="container">
    <div class="card">
      <h2>Aguardando Medicação</h2>
      <ul id="listaFila" class="pacientes-list">
        <li>Carregando fila...</li>
      </ul>
    </div>

    <div class="card">
      <h2>Aplicação de Medicamentos</h2>
      <form id="form-medicacao">
        <input type="hidden" id="pacienteId">

        <label for="paciente">Nome do Paciente:</label>
        <input type="text" id="paciente" placeholder="Selecione na lista ao lado" readonly required>

        <label for="prescricao">Prescrição Médica:</label>
        <textarea id="prescricao" rows="3" readonly placeholder="A prescrição enviada pelo médico aparecerá aqui..."></textarea>

        <label for="obsMedicacao">Observações da Aplicação:</label>
        <input type="text" id="obsMedicacao" placeholder="Ex: Medicação oral administrada sem intercorrências...">

        <button type="submit">Concluir Medicação (Encaminhar para Alta)</button>
      </form>
    </div>
  </main>

  <script>
    const API_URL = "http://localhost:3000";

    // 1. Verificar Autenticação
    const usuarioLogado = JSON.parse(sessionStorage.getItem("usuario"));
    if (!usuarioLogado || usuarioLogado.tipo !== "medicacao") {
      window.location.href = "login.html";
    }

    function logout() {
      sessionStorage.removeItem("usuario");
      window.location.href = "login.html";
    }

    // 2. Buscar Pacientes com status 'aguardando_medicacao'
    async function carregarFila() {
      const listaFila = document.getElementById("listaFila");
      listaFila.innerHTML = "<li>Carregando fila...</li>";

      try {
        const res = await fetch(`${API_URL}/pacientes/medicacao`);
        const pacientes = await res.json();

        listaFila.innerHTML = "";

        if (pacientes.length === 0) {
          listaFila.innerHTML = "<li>Nenhum paciente aguardando medicação.</li>";
          return;
        }

        pacientes.forEach(p => {
          const li = document.createElement("li");
          li.classList.add("paciente-item");
          li.innerHTML = `<strong>${p.nome}</strong>`;
          li.onclick = () => selecionarPaciente(p);
          listaFila.appendChild(li);
        });
      } catch (error) {
        console.error("Erro ao carregar fila de medicação:", error);
        listaFila.innerHTML = "<li>Erro ao carregar pacientes.</li>";
      }
    }

    // 3. Selecionar Paciente
    function selecionarPaciente(paciente) {
      document.getElementById("pacienteId").value = paciente.id;
      document.getElementById("paciente").value = paciente.nome;
      document.getElementById("prescricao").value = paciente.prescricao || "Sem prescrição detalhada.";
    }

    // 4. Concluir Medicação
    document.getElementById("form-medicacao").addEventListener("submit", async (e) => {
      e.preventDefault();

      const pacienteId = document.getElementById("pacienteId").value;
      if (!pacienteId) {
        alert("Selecione um paciente na lista!");
        return;
      }

      try {
        const res = await fetch(`${API_URL}/medicacao/aplicar`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            pacienteId: Number(pacienteId),
            obs: document.getElementById("obsMedicacao").value
          })
        });

        if (res.ok) {
          alert("Medicação concluída! Paciente encaminhado para a ALTA.");
          document.getElementById("form-medicacao").reset();
          document.getElementById("pacienteId").value = "";
          carregarFila();
        } else {
          alert("Erro ao registrar medicação.");
        }
      } catch (error) {
        console.error("Erro ao processar medicação:", error);
        alert("Erro de conexão com o servidor.");
      }
    });

    carregarFila();
    setInterval(carregarFila, 5000);
  </script>
</body>
</html>
